services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ballbook_main
      POSTGRES_USER: ballbook
      POSTGRES_PASSWORD: ballbook_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballbook -d ballbook_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo_db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ballbook
      MONGO_INITDB_ROOT_PASSWORD: ballbook_secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://ballbook:ballbook_secret@postgres_db:5432/ballbook_main
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkey123
      PORT: "3001"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  search-service:
    build: ./search-service
    ports:
      - "3002:3002"
    environment:
      MONGO_URL: mongodb://ballbook:ballbook_secret@mongo_db:27017/ballbook_search?authSource=admin
      AUTH_SERVICE_URL: http://auth-service:3001
      PORT: "3002"
    depends_on:
      mongo_db:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  pricing-service:
    build: ./pricing-service
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "3005:3005"
    environment:
      PORT: "3005"
    restart: unless-stopped

  booking-service:
    build: ./booking-service
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://ballbook:ballbook_secret@postgres_db:5432/ballbook_main
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      SEARCH_SERVICE_URL: http://search-service:3002
      PRICING_SERVICE_URL: http://pricing-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      PORT: "3003"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      search-service:
        condition: service_started
      pricing-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost/api
    depends_on:
      auth-service:
        condition: service_started
      search-service:
        condition: service_started
      booking-service:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_started
      search-service:
        condition: service_started
      booking-service:
        condition: service_started
      pricing-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
